# Render の設定（Blueprint）。Render のダッシュボードで「New → Blueprint」からこのリポジトリを選ぶと、この内容で作られる
# 秘密の値（sync: false）は、作成するときに画面で入力する（このファイルやリポジトリには書かない）
services:
  - type: web
    name: ally-study
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DB_TLS
        value: "true"
      # Render のロードバランサーからの X-Forwarded-For だけを信用する（Render の内部ネットワーク）
      - key: TRUSTED_PROXIES
        value: "10.0.0.0/8"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # 管理者のユーザーID（カンマ区切り）。アクセス解析の管理画面（/admin）を見られる
      - key: ADMIN_USER_IDS
        sync: false
      # アクセス解析用の DB（TiDB Cloud Starter の別インスタンス）。設定しなければ本体と同じ DB を使う
      # 別インスタンスにしておくと、解析で無料枠を使い切っても本体は止まらない
      - key: ANALYTICS_DB_HOST
        sync: false
      - key: ANALYTICS_DB_NAME
        sync: false
      - key: ANALYTICS_DB_USER
        sync: false
      - key: ANALYTICS_DB_PASSWORD
        sync: false
