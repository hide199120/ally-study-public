# ローカル開発用の構成
#   docker compose up --build   … 起動
#   docker compose down         … 停止（DBのデータは残る）
#   docker compose down -v      … 停止してDBのデータも削除
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ally_study}
      MYSQL_USER: ${DB_USER:-ally}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ally_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # DBのマイグレーション（backend/db/migrations のSQLを順番に適用して終了する）
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=mysql://${DB_USER:-ally}:${DB_PASSWORD:-ally_password}@tcp(db:3306)/${DB_NAME:-ally_study}?multiStatements=true
      - up
    depends_on:
      db:
        condition: service_healthy

  # アクセス解析用のマイグレーション（backend/db/analytics）
  # 本番は別の DB（インスタンス）に置くが、ローカルは同じ DB に同居させる。
  # 適用済みの番号は本体と混ざらないよう、別のテーブル（analytics_schema_migrations）に記録する
  migrate-analytics:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/db/analytics:/migrations:ro
    command:
      - -path=/migrations
      - -database=mysql://${DB_USER:-ally}:${DB_PASSWORD:-ally_password}@tcp(db:3306)/${DB_NAME:-ally_study}?multiStatements=true&x-migrations-table=analytics_schema_migrations
      - up
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ally_study}
      DB_USER: ${DB_USER:-ally}
      DB_PASSWORD: ${DB_PASSWORD:-ally_password}
      # 管理者のユーザーID（カンマ区切り）。アクセス解析の管理画面（/admin）を見られる
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      migrate-analytics:
        condition: service_completed_successfully

volumes:
  db-data:
