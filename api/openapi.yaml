openapi: 3.0.3
info:
  title: ally-study API
  version: 0.1.0
  description: |
    勉強のお供Webアプリ「ally-study」のAPI仕様です。

    ## 認証
    ログインに成功すると、セッションIDが `session_id` Cookie（HttpOnly / SameSite=Lax）で発行されます。
    認証が必要なAPIは、このCookieを送ることで呼び出せます。
servers:
  - url: http://localhost:8080/api
    description: ローカル開発環境

tags:
  - name: system
    description: 動作確認
  - name: auth
    description: 新規登録・ログイン・ログアウト
  - name: users
    description: ユーザー情報
  - name: room
    description: 部屋の模様替え（家具の配置・バッグ・壁紙・住人）

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: ヘルスチェック
      description: APIサーバーが起動していて、DBに接続できるかを確認します。
      security: []
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "503":
          description: DBに接続できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: unavailable

  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 新規登録
      description: ユーザー名とパスワードでユーザーを作成し、そのままログイン状態にします。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: 登録成功
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: ユーザー名がすでに使われている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: username_taken
                message: このユーザー名はすでに使われています

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: ログイン成功
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: ユーザー名またはパスワードが違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_credentials
                message: ユーザー名またはパスワードが正しくありません

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウト
      description: セッションを削除し、Cookieを無効にします。
      responses:
        "204":
          description: ログアウト成功
          headers:
            Set-Cookie:
              description: 有効期限切れの `session_id` Cookie（削除用）
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [users]
      operationId: getMe
      summary: ログイン中のユーザー情報を取得
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/room:
    get:
      tags: [room]
      operationId: getMyRoom
      summary: ログイン中のユーザーの部屋を取得
      description: |
        壁紙・住人（女の子/男の子）・家具の配置を返します。
        まだ一度も保存していないユーザーには初期設定を返します。
        `furniture` に含まれない家具は、フロント側で決めた初期状態（初期配置 or バッグの中）として扱います。
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [room]
      operationId: updateMyRoom
      summary: ログイン中のユーザーの部屋を保存
      description: 部屋の設定を丸ごと置き換えます（模様替えの「完了」を押したときに呼ばれます）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Room"
      responses:
        "200":
          description: 保存成功（保存後の部屋を返す）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id

  headers:
    SetSessionCookie:
      description: "`session_id` Cookie（HttpOnly; SameSite=Lax; Path=/）"
      schema:
        type: string
        example: session_id=abc123; Path=/; HttpOnly; SameSite=Lax; Max-Age=604800

  responses:
    BadRequest:
      description: 入力内容が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_error
            message: ユーザー名は3〜32文字の半角英数字とアンダースコアで入力してください
    Unauthorized:
      description: ログインしていない、またはセッションが切れている
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: ログインしてください

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
          example: ok

    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_]+$"
          example: ally_user
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: bcryptの上限に合わせて最大72文字
          example: password1234

    User:
      type: object
      required: [id, username, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: ally_user
        createdAt:
          type: string
          format: date-time
          example: "2026-10-02T23:45:00+09:00"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 機械的に判定するためのエラーコード
          example: validation_error
        message:
          type: string
          description: 画面に表示できるメッセージ
          example: 入力内容を確認してください

    Room:
      type: object
      description: ユーザーごとの部屋の設定
      required: [avatar, wallpaper, furniture]
      properties:
        avatar:
          $ref: "#/components/schemas/Avatar"
        wallpaper:
          $ref: "#/components/schemas/Wallpaper"
        furniture:
          type: array
          description: 家具ごとの状態（部屋に出しているか、バッグの中か）と位置。同じ家具は1回だけ
          maxItems: 17
          items:
            $ref: "#/components/schemas/FurniturePlacement"

    Avatar:
      type: string
      description: 部屋にいる住人（girl=女の子, boy=男の子）
      enum: [girl, boy]
      example: girl

    Wallpaper:
      type: string
      description: |
        壁紙
        - meadow: 若草
        - cream: クリームストライプ
        - dots: さくら水玉
        - botanical: ボタニカル
        - gingham: ギンガムチェック
        - night: 星空
        - wood: 板張り
      enum: [meadow, cream, dots, botanical, gingham, night, wood]
      example: meadow

    FurnitureId:
      type: string
      description: 動かせる家具の種類
      enum:
        - bed
        - desk
        - chair
        - sideTable
        - rug
        - plantRight
        - plantLeft
        - cat
        - backpack
        - bookshelf
        - beanbag
        - floorLamp
        - lowTable
        - cactus
        - guitar
        - fishbowl
        - sofa
      example: bed

    FurniturePlacement:
      type: object
      required: [id, placed, x, z]
      properties:
        id:
          $ref: "#/components/schemas/FurnitureId"
        placed:
          type: boolean
          description: true=部屋に出している / false=バッグの中
          example: true
        x:
          type: number
          format: double
          description: 初期位置から床の上でどれだけ動かしたか（x方向）
          minimum: -6
          maximum: 6
          example: -0.5
        z:
          type: number
          format: double
          description: 初期位置から床の上でどれだけ動かしたか（z方向）
          minimum: -6
          maximum: 6
          example: 0.3
