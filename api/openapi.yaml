openapi: 3.0.3
info:
  title: ally-study API
  version: 0.1.0
  description: |
    勉強のお供Webアプリ「ally-study」のAPI仕様です。

    ## 認証
    ログインに成功すると、セッションIDが `session_id` Cookie（HttpOnly / SameSite=Lax）で発行されます。
    認証が必要なAPIは、このCookieを送ることで呼び出せます。
servers:
  - url: http://localhost:8080/api
    description: ローカル開発環境

tags:
  - name: system
    description: 動作確認
  - name: auth
    description: 新規登録・ログイン・ログアウト
  - name: users
    description: ユーザー情報
  - name: room
    description: 部屋の模様替え（家具の配置・バッグ・壁紙・住人）
  - name: study
    description: 学習記録（勉強時間・週の目標・資格やタスクの目標）

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: ヘルスチェック
      description: APIサーバーが起動していて、DBに接続できるかを確認します。
      security: []
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "503":
          description: DBに接続できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: unavailable

  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 新規登録
      description: ユーザー名とパスワードでユーザーを作成し、そのままログイン状態にします。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: 登録成功
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: ユーザー名がすでに使われている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: username_taken
                message: このユーザー名はすでに使われています
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: ログイン成功
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: ユーザー名またはパスワードが違う
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_credentials
                message: ユーザー名またはパスワードが正しくありません
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウト
      description: セッションを削除し、Cookieを無効にします。
      responses:
        "204":
          description: ログアウト成功
          headers:
            Set-Cookie:
              description: 有効期限切れの `session_id` Cookie（削除用）
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [users]
      operationId: getMe
      summary: ログイン中のユーザー情報を取得
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [users]
      operationId: deleteMe
      summary: 退会（アカウントの削除）
      description: |
        確認のためパスワードを受け取り、ユーザーと、そのユーザーの部屋・学習記録・セッションをすべて削除します。
        元に戻すことはできません。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: 削除成功（セッションCookieも無効にする）
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me/room:
    get:
      tags: [room]
      operationId: getMyRoom
      summary: ログイン中のユーザーの部屋を取得
      description: |
        壁紙・住人（女の子/男の子）・家具の配置を返します。
        まだ一度も保存していないユーザーには初期設定を返します。
        `furniture` に含まれない家具は、フロント側で決めた初期状態（初期配置 or バッグの中）として扱います。
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [room]
      operationId: updateMyRoom
      summary: ログイン中のユーザーの部屋を保存
      description: 部屋の設定を丸ごと置き換えます（模様替えの「完了」を押したときに呼ばれます）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Room"
      responses:
        "200":
          description: 保存成功（保存後の部屋を返す）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/study:
    get:
      tags: [study]
      operationId: getMyStudy
      summary: ログイン中のユーザーの学習記録を取得
      description: |
        週の目標時間、資格やタスクの目標、日ごとの勉強時間を返します。
        日ごとの勉強時間は、直近 60 日ぶんを返します（勉強した日だけ）。
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/study/sessions:
    post:
      tags: [study]
      operationId: addStudySession
      summary: 勉強した時間を記録
      description: |
        タイマーで勉強した時間を1回分記録し、その日の合計を返します。
        日付はブラウザの日付（ユーザーのタイムゾーン）で送ります。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: 記録成功（その日の合計）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyDay"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/study/settings:
    put:
      tags: [study]
      operationId: updateStudySettings
      summary: 週の目標時間を保存
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySettings"
      responses:
        "200":
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/study/goals:
    put:
      tags: [study]
      operationId: updateStudyGoals
      summary: 資格やタスクの目標を保存
      description: 目標の一覧を丸ごと置き換えます（件数が少ないため、一覧ごと保存する）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyGoals"
      responses:
        "200":
          description: 保存成功（保存後の一覧）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGoals"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id

  headers:
    SetSessionCookie:
      description: "`session_id` Cookie（HttpOnly; SameSite=Lax; Path=/）"
      schema:
        type: string
        example: session_id=abc123; Path=/; HttpOnly; SameSite=Lax; Max-Age=604800

  responses:
    BadRequest:
      description: 入力内容が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_error
            message: ユーザー名は3〜32文字の半角英数字とアンダースコアで入力してください
    Unauthorized:
      description: ログインしていない、またはセッションが切れている
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: ログインしてください
    TooManyRequests:
      description: 短い時間にリクエストが多すぎる（しばらく待ってから再度試す）
      headers:
        Retry-After:
          description: 再度試せるようになるまでの秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: too_many_requests
            message: 操作が多すぎます。しばらく待ってからもう一度お試しください

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
          example: ok

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: 確認のための今のパスワード
          format: password

    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_]+$"
          example: ally_user
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: bcryptの上限に合わせて最大72文字
          example: password1234

    User:
      type: object
      required: [id, username, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: ally_user
        createdAt:
          type: string
          format: date-time
          example: "2026-10-02T23:45:00+09:00"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 機械的に判定するためのエラーコード
          example: validation_error
        message:
          type: string
          description: 画面に表示できるメッセージ
          example: 入力内容を確認してください

    Room:
      type: object
      description: ユーザーごとの部屋の設定
      required: [avatar, wallpaper, furniture]
      properties:
        avatar:
          $ref: "#/components/schemas/Avatar"
        wallpaper:
          $ref: "#/components/schemas/Wallpaper"
        furniture:
          type: array
          description: 家具ごとの状態（部屋に出しているか、バッグの中か）と位置。同じ家具は1回だけ
          maxItems: 17
          items:
            $ref: "#/components/schemas/FurniturePlacement"

    Avatar:
      type: string
      description: 部屋にいる住人（girl=女の子, boy=男の子）
      enum: [girl, boy]
      example: girl

    Wallpaper:
      type: string
      description: |
        壁紙
        - meadow: 若草
        - cream: クリームストライプ
        - dots: さくら水玉
        - botanical: ボタニカル
        - gingham: ギンガムチェック
        - night: 星空
        - wood: 板張り
      enum: [meadow, cream, dots, botanical, gingham, night, wood]
      example: meadow

    FurnitureId:
      type: string
      description: 動かせる家具の種類
      enum:
        - bed
        - desk
        - chair
        - sideTable
        - rug
        - plantRight
        - plantLeft
        - cat
        - backpack
        - bookshelf
        - beanbag
        - floorLamp
        - lowTable
        - cactus
        - guitar
        - fishbowl
        - sofa
      example: bed

    FurniturePlacement:
      type: object
      required: [id, placed, x, z]
      properties:
        id:
          $ref: "#/components/schemas/FurnitureId"
        placed:
          type: boolean
          description: true=部屋に出している / false=バッグの中
          example: true
        x:
          type: number
          format: double
          description: 初期位置から床の上でどれだけ動かしたか（x方向）
          minimum: -6
          maximum: 6
          example: -0.5
        z:
          type: number
          format: double
          description: 初期位置から床の上でどれだけ動かしたか（z方向）
          minimum: -6
          maximum: 6
          example: 0.3

    StudyOverview:
      type: object
      description: ユーザーの学習記録
      required: [weeklyGoalMinutes, goals, days]
      properties:
        weeklyGoalMinutes:
          type: integer
          description: 1週間（月〜日）の目標の勉強時間（分）
          example: 600
        goals:
          type: array
          items:
            $ref: "#/components/schemas/StudyGoal"
        days:
          type: array
          description: 日ごとの勉強時間（勉強した日だけ。日付の古い順）
          items:
            $ref: "#/components/schemas/StudyDay"

    StudyDay:
      type: object
      required: [date, minutes]
      properties:
        date:
          $ref: "#/components/schemas/LocalDate"
        minutes:
          type: integer
          description: その日の勉強時間の合計（分）
          example: 95

    LocalDate:
      type: string
      description: ユーザーのタイムゾーンでの日付（YYYY-MM-DD）
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      example: "2026-10-12"

    StudyMode:
      type: string
      description: どのタイマーで勉強したか（pomodoro=ポモドーロ, stopwatch=ストップウォッチ）
      enum: [pomodoro, stopwatch]
      example: pomodoro

    StudySessionInput:
      type: object
      required: [date, minutes, mode]
      properties:
        date:
          $ref: "#/components/schemas/LocalDate"
        minutes:
          type: integer
          description: 勉強した時間（分）
          minimum: 1
          maximum: 720
          example: 25
        mode:
          $ref: "#/components/schemas/StudyMode"

    StudySettings:
      type: object
      required: [weeklyGoalMinutes]
      properties:
        weeklyGoalMinutes:
          type: integer
          description: 1週間（月〜日）の目標の勉強時間（分）。0 は目標なし
          minimum: 0
          maximum: 6000
          example: 600

    GoalKind:
      type: string
      description: 目標の種類（certification=資格, task=タスク）
      enum: [certification, task]
      example: certification

    StudyGoal:
      type: object
      required: [id, kind, title, done]
      properties:
        id:
          type: string
          description: 目標のID（フロントで作る）
          minLength: 1
          maxLength: 36
          example: 8f14e45f-ceea-467e-a2b3-0e5d1c3a9b71
        kind:
          $ref: "#/components/schemas/GoalKind"
        title:
          type: string
          minLength: 1
          maxLength: 50
          example: AWS 認定 DevOps Engineer - Professional
        dueDate:
          $ref: "#/components/schemas/LocalDate"
        done:
          type: boolean
          description: 達成したか
          example: false

    StudyGoals:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          description: 目標の一覧（表示順）
          maxItems: 30
          items:
            $ref: "#/components/schemas/StudyGoal"
